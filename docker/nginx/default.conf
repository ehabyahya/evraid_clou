# EVRaid Cloud - Hardened Nginx HTTPS & Reverse Proxy Configuration
# Directs public HTTPS traffic on 443 to internal Docker services with HTTP->HTTPS redirection

# Rate limiting zones (10MB buffer holds ~160,000 IP states)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=60r/s;
limit_req_status 429;

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

# 1. HTTP Server - Redirects all traffic to HTTPS (except Let's Encrypt ACME challenge)
server {
    listen 80;
    server_name fleet.evraid.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server - Hardened SSL Termination & Reverse Proxy
server {
    listen 443 ssl;
    http2 on;
    server_name fleet.evraid.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/fleet.evraid.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fleet.evraid.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # High-throughput Telemetry Ingestion (Mobile app & cellular modules)
    location /v1/telemetry/ {
        limit_req zone=ingest_limit burst=30 nodelay;

        proxy_pass http://backend_upstream/v1/telemetry/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Standard API routes (Dashboard & Admin endpoints)
    location /v1/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Password-Protected Interactive Documentation & OpenAPI Schema
    location /docs {
        auth_basic "Restricted EVRaid Engineering Area";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        auth_basic "Restricted EVRaid Engineering Area";
        auth_basic_user_file /etc/nginx/conf.d/.htpasswd;

        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next.js Frontend Dashboard
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
