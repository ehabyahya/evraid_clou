version: '3.8'

services:
  # 1. TimescaleDB (PostgreSQL 16 + TimescaleDB extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: evraid_timescaledb
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evraid_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evraid_admin_pass}
      POSTGRES_DB: ${POSTGRES_DB:-evraid_cloud}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evraid_admin} -d ${POSTGRES_DB:-evraid_cloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evraid_net

  # 2. Redis Cluster / Single Node (Hot State Cache)
  redis:
    image: redis:7-alpine
    container_name: evraid_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evraid_net

  # 3. EVRaid Cloud Ingestion API Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evraid_backend
    restart: always
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PROJECT_NAME=${PROJECT_NAME:-EVRaid Cloud Fleet Platform}
      - ENVIRONMENT=production
      - API_V1_STR=/v1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-evraid_admin}:${POSTGRES_PASSWORD:-evraid_admin_pass}@timescaledb:5432/${POSTGRES_DB:-evraid_cloud}
      - REDIS_URL=redis://redis:6379/0
      - INTERNAL_SYNC_TOKEN=${INTERNAL_SYNC_TOKEN:-evraid-secret}
    networks:
      - evraid_net

  # 4. EVRaid Cloud Web Dashboard (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evraid_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/v1}
      - NODE_ENV=production
    networks:
      - evraid_net

  # 5. Nginx Reverse Proxy (Routes 80/443 to frontend and backend)
  nginx:
    image: nginx:alpine
    container_name: evraid_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/.htpasswd:/etc/nginx/conf.d/.htpasswd:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - evraid_net

networks:
  evraid_net:
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  certbot_conf:
  certbot_www:

